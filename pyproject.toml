[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readaloud"
version = "0.1.0"
description = "Turn university readings into local chaptered audio."
requires-python = ">=3.11"
dependencies = [
    "kokoro-onnx",
    "soundfile",
    "pdf-inspector",
    "piper-tts",
]

[tool.setuptools.packages.find]
where = ["src"]
